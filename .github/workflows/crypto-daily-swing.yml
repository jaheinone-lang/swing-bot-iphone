name: BTC ETH 1d longer-term swing research (READ-ONLY)
on:
  push:
    branches:
      - 'research/crypto-alpha-*'
    paths:
      - 'swingbot/daily_swing_research.py'
      - 'swingbot/monthly_hold_research.py'
      - 'swingbot/two_sleeve_goal_report.py'
      - 'tests/test_two_sleeve_goal_report.py'
      - 'tests/test_monthly_hold_research.py'
      - 'tests/test_daily_swing_research.py'
      - '.github/workflows/crypto-daily-swing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypto-daily-swing-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and no-leverage safeguards
        run: |
          python -m unittest discover -s tests -p 'test_daily_swing_research.py' -v
          python -m unittest discover -s tests -p 'test_monthly_hold_research.py' -v
          python -m unittest discover -s tests -p 'test_two_sleeve_goal_report.py' -v
      - name: Download actual BTC ETH 1d Bitvavo candles and replay
        run: |
          python -m swingbot.daily_swing_research > /tmp/crypto-daily.json
          python - <<'PY'
          import json
          from pathlib import Path
          from swingbot.daily_swing_research import history
          from swingbot.monthly_hold_research import study
          sections,_=history()
          Path('/tmp/hold-dca.json').write_text(json.dumps(study(sections),ensure_ascii=False))
          PY
      - name: Publish actual daily backtest outcomes
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/crypto-daily.json').read_text())
          print('DAILY_SWING_VERIFIED_RESULT='+json.dumps(d,ensure_ascii=False))
          hold=json.loads(Path('/tmp/hold-dca.json').read_text())
          print('MONTHLY_HOLD_VERIFIED_RESULT='+json.dumps(hold,ensure_ascii=False))
          from swingbot.two_sleeve_goal_report import report
          # Historical demonstration only: 55d breakout in 2024-2026
          # and EUR200/month hold over the SAME period, not live accounts.
          trade=next(x for x in d['strategies'] if x['rule']=='breakout55')['later']
          scenario=hold['scenarios']['later']['normal_costs']
          deposits=[{'month':r['month'],'eur':r['amount_eur']}
                    for r in scenario['deposit_schedule']]
          snapshot=report(as_of=scenario['last_valued_day'],
                  trading_equity_eur=trade['end_eur'],
                  holding_liquidation_eur=scenario['estimated_liquidation_eur'],
                  holding_contributions=deposits)
          print('DUAL_SLEEVE_HISTORICAL_SNAPSHOT='+json.dumps(snapshot,ensure_ascii=False))
          Path('/tmp/dual-sleeve-snapshot.json').write_text(json.dumps(snapshot,ensure_ascii=False))
          lines=[
           '# BTC + ETH genuine 1-day candles, spot only, research',
           'Each era starts with a new EUR 5000 account; 2021-23 vs 2024-26.',
           '',
           '| Strategy | 2021-23 PnL € | 2021-23 trades | Later PnL € | Later trades | Later 2x costs € |',
           '|---|---:|---:|---:|---:|---:|'
          ]
          for x in d['strategies']:
              a=x['early'];b=x['later'];c=x['later_double']
              lines.append(f"| {x['rule']} | {a['pnl_eur']:.2f} | "
                 f"{a['trades']} | {b['pnl_eur']:.2f} | "
                 f"{b['trades']} | {c['pnl_eur']:.2f} |")
          lines += ['', '## Separate monthly BTC ETH holding sleeve EUR200 external deposits',
            '| Era | Months | Deposits € | Hold liquidation € | Net market PnL € | Double costs PnL € |',
            '|---|---:|---:|---:|---:|---:|']
          for era,rows in hold['scenarios'].items():
              a=rows['normal_costs'];b=rows['double_costs']
              lines.append(f"| {era} | {a['months_funded']} | "
                f"{a['contributions_eur']:.2f} | {a['estimated_liquidation_eur']:.2f} | "
                f"{a['net_market_pnl_eur']:.2f} | {b['net_market_pnl_eur']:.2f} |")
          lines += ['', 'Benchmark: EUR cash = 0 € nominal PnL.',
            '20% BTC+ETH buy-hold: '+json.dumps(d['btc_eth_20pct_buy_hold'],ensure_ascii=False),
            '', '**All IN-SAMPLE simulation only. No live approval, no tax.**']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc-eth-daily-long-horizon-research
          path: |
            /tmp/crypto-daily.json
            /tmp/hold-dca.json
            /tmp/dual-sleeve-snapshot.json
          retention-days: 30
