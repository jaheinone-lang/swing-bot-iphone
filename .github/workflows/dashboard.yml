name: Update iPhone paper dashboard
on:
  workflow_dispatch:
  # Run after UTC daily close. Best effort; GitHub cron may run late.
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard.yml'
      - 'swingbot/dashboard_report.py'
      - 'swingbot/forward_paper.py'
      - 'swingbot/market_data.py'
      - 'swingbot/bitvavo_data.py'
      - 'swingbot/yahoo_data.py'
      - 'docs/index.html'
permissions:
  contents: write
concurrency:
  group: public-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline paper safety tests before publishing
        run: python -m unittest discover -s tests -v
      - name: Produce read-only EUR market snapshot (no broker credentials)
        run: python -m swingbot.dashboard_report
      - name: Commit snapshot and paper state atomically to git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if test -f paper/state.json; then git add paper/state.json; fi
          if git diff --cached --quiet; then
            echo 'Snapshot is unchanged'
            exit 0
          fi
          git commit -m "Update public paper dashboard data [skip ci]"
          for retry in 1 2 3; do
            git fetch origin main
            # Rebase is safe only for a single writer. After concurrent pushes,
            # re-fetch and re-run on the next schedule if a ledger conflict occurs.
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Snapshot successfully published'
              exit 0
            fi
            echo "Concurrent update detected (attempt $retry); retrying"
            sleep 2
          done
          echo 'Could not publish snapshot after three attempts' >&2
          exit 1
