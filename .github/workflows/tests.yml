name: Python safety tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test prototype strategy and portfolio
        run: python -m unittest discover -s tests -v
      - name: Show synthetic dual-market backtest
        run: python -m swingbot.multi_cli --mode demo --summary-only
