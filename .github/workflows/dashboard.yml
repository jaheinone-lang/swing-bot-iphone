name: Update iPhone paper dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard.yml'
      - 'swingbot/dashboard_report.py'
      - 'swingbot/market_data.py'
      - 'swingbot/bitvavo_data.py'
      - 'swingbot/yahoo_data.py'
      - 'docs/index.html'
permissions:
  contents: write
concurrency:
  group: public-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce read-only EUR market snapshot (no broker credentials)
        run: python -m swingbot.dashboard_report
      - name: Commit snapshot to public docs folder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if git diff --cached --quiet; then
            echo 'Snapshot is unchanged'
            exit 0
          fi
          git commit -m "Update public paper dashboard data [skip ci]"
          for retry in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Snapshot successfully published'
              exit 0
            fi
            echo "Concurrent update detected (attempt $retry); retrying"
            sleep 2
          done
          echo 'Could not publish snapshot after three attempts' >&2
          exit 1
