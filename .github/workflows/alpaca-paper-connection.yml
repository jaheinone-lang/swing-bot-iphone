# Independent PAPER-only smoke check. Intentionally on the default branch so
# GitHub Actions can show the Run workflow control without merging research.
# No market data requests, broker orders, account body, or secret logging.
name: Alpaca PAPER connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-paper-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate credentials against PAPER endpoint (read-only)
        env:
          ALPACA_DATA_KEY_ID: ${{ secrets.ALPACA_PAPER_DATA_KEY_ID }}
          ALPACA_DATA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_DATA_SECRET_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("ALPACA_DATA_KEY_ID", "")
          secret = os.environ.get("ALPACA_DATA_SECRET_KEY", "")
          result = {
              "status": "MISSING_PAPER_KEYS",
              "paper_only": True,
              "market_data_requested": False,
              "orders_sent": False,
          }
          if not key or not secret:
              print(json.dumps(result))
              sys.exit(1)

          # GET-only to PAPER host. Never use live-api.alpaca.markets.
          req = urllib.request.Request(
              "https://paper-api.alpaca.markets/v2/account",
              headers={
                  "APCA-API-KEY-ID": key,
                  "APCA-API-SECRET-KEY": secret,
                  "Accept": "application/json",
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  # Do not read or log the account response body.
                  result["status"] = (
                      "PAPER_API_OK" if response.status == 200
                      else "PAPER_API_UNEXPECTED_HTTP"
                  )
          except urllib.error.HTTPError as exc:
              result["status"] = (
                  "PAPER_API_UNAUTHORIZED" if exc.code in (401, 403)
                  else "PAPER_API_HTTP_ERROR"
              )
          except (urllib.error.URLError, TimeoutError, OSError):
              result["status"] = "PAPER_API_NETWORK_ERROR"
          print(json.dumps(result))
          sys.exit(0 if result["status"] == "PAPER_API_OK" else 1)
          PY
