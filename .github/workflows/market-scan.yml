name: Public crypto market scan (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'swingbot/bitvavo_data.py'
      - 'swingbot/market_scan.py'
      - '.github/workflows/market-scan.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get public Bitvavo EUR candles and signals (NO TRADES)
        run: python -m swingbot.market_scan --crypto
