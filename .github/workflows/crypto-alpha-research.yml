name: Crypto alpha research (READ-ONLY)
on:
  push:
    branches:
      - 'research/crypto-alpha-*'
    paths:
      - 'swingbot/crypto_alpha_research.py'
      - 'swingbot/crypto_validation.py'
      - 'swingbot/crypto_allocation_research.py'
      - 'swingbot/strategy_lab.py'
      - 'tests/test_crypto_alpha_research.py'
      - 'tests/test_crypto_allocation_research.py'
      - '.github/workflows/crypto-alpha-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crypto-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety and research tests
        run: python -m unittest discover -s tests -v
      - name: Fetch completed public candles and compare candidate strategies
        run: |
          python -m swingbot.crypto_alpha_research > /tmp/crypto-research.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path('/tmp/crypto-research.json').read_text())
          summary=['# Crypto-only research (no orders)',
                   f"Historical window: {result['start']} to {result['end']} ({result['calendar_days']} days)",
                   f"Training/later split: {result['split_day']}",
                   f"Uniform earliest entry: {result['first_entry_day']}",
                   f"Training-selected candidate: **{result['winner_on_training']}**",
                   '',
                   '| Strategy | Development % | Later % | Later DD % | Net 5k -> € | 2x costs € | 3% risk cap € | Worst 90d % |',
                   '|---|---:|---:|---:|---:|---:|---:|---:|']
          for r in result['candidates']:
              summary.append(
                  f"| {r['name']} | {r['development']['total_return_pct']} | "
                  f"{r['later_period']['total_return_pct']} | "
                  f"{r['later_period']['max_drawdown_pct']} | "
                  f"{r['full_period_after_tax_eur']:.2f} | "
                  f"{r['fee_stress_after_tax_eur']:.2f} | "
                  f"{r['risk_cap_3pct_after_tax_eur']:.2f} | "
                  f"{r['nonoverlapping_90d_windows']['worst_90d_return_pct']} |"
              )
          summary.extend(['', '### Buy-and-hold controls (201-candle warmup)',
                          '| Control | Whole-period % | Later-period % | Max DD % | Final € |',
                          '|---|---:|---:|---:|---:|'])
          for label, row in result['hold_benchmarks'].items():
              summary.append(
                  f"| {label} | {row['whole_period']['total_return_pct']} | "
                  f"{row['later_period']['total_return_pct']} | "
                  f"{row['whole_period']['max_drawdown_pct']} | "
                  f"{row['final_equity_eur']:.2f} |"
              )
          summary.extend([
              '',
              '**Caveats:** strategies and buy-and-hold may enter only after 201 completed daily candles. '
              'Buy-and-hold does not pay liquidation taxes; strategy reserves estimated realized-gain tax. '
              'Raw performance is NOT apples-to-apples after-tax alpha. These are about 719 historical days only, '
              'not independent prospective verification. The 3% stop-risk guard is nominal and cannot bound gap losses. '
              'No live orders or account connection.'
          ])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as handle:
              handle.write('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          PY

      - name: Compare €5000 E60 against E100 risk-capped and all-in over fresh last 30 days
        run: |
          python -m swingbot.crypto_allocation_research > /tmp/crypto-allocation-30d.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          research = json.loads(Path('/tmp/crypto-allocation-30d.json').read_text())
          lines = [
              '',
              '# Capital allocation: EUR 5,000 reinvested; new account in last 30 completed days',
              f"Window {research['recent_month_start']} to {research['history_end']}; "
              "no external deposits, returns compound on the whole changing balance.",
              '| Model | 30d end € | 30d profit € | Return % | 30d max DD % | Average invested % | Days ≥95% invested | Buy events | Entire history end € | Entire history max DD % |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for r in research['scenarios']:
              m = r['most_recent_30d_from_fresh_5000']
              h = r['full_history_compounding']
              lines.append(
                  f"| {r['name']} | {m['ending_eur']:.2f} | {m['profit_eur']:.2f} | "
                  f"{m['return_pct']:.2f} | {m['max_drawdown_pct']:.2f} | "
                  f"{m['mean_invested_share_pct']:.2f} | "
                  f"{m['days_95pct_or_more_invested']} | {m['buy_events']} | "
                  f"{h['final_equity_eur']:.2f} | {h['max_drawdown_pct']:.2f} |"
              )
          lines.extend([
              '',
              'CAUTION: **all-in removes per-trade stop-risk sizing**. '
              'Funds can be heavily concentrated, 25% max-DD rule freezes NEW entries '
              'but does not guarantee protection. '
              'When BUY signals do not occur, even 100% allocation-enabled models hold cash. '
              'Tax reserves cover only realized gains; the fee assumptions are estimates. '
              'Historical tuning is not future validation. NO live trading, no position changes.'
          ])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
