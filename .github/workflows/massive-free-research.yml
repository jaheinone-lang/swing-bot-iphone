# Opt-in US stock EOD research; no trading, no public symbol data.
# The only secret is an API key for a market-data service, NOT a broker key.
name: Free US stock EOD research test
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-us-eod-research
  cancel-in-progress: true

jobs:
  validate-free-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline source, parsing and safety checks
        run: python -m unittest discover -s tests -v
      - name: Explain permission needed before market-data research
        if: ${{ vars.MASSIVE_NON_DISPLAY_LICENSE_VERIFIED != 'true' }}
        run: |
          echo 'Offline tests complete. Live Massive data fetch disabled.'
          echo 'Personal market-data terms restrict non-display strategy research.'
          echo 'Requires an independently confirmed license; no API calls made.'
      - name: Optional Massive fetch ONLY with confirmed separate non-display permission
        if: ${{ vars.MASSIVE_NON_DISPLAY_LICENSE_VERIFIED == 'true' }}
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python -m swingbot.massive_free
          # This only checks EOD data completeness, no per-symbol price/score.
          # Never enable this without provider-confirmed data usage rights.
